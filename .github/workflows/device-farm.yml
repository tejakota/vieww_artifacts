 profile A/B input

From the first run with the CPU present path and the dist APK (LG Stylo 5,
Galaxy A36, Galaxy S26 Ultra):
- APK 15.6 MB -> 2.6 MB (dist): the under-6-MB target is met.
- LG CPU path: present 19.8 -> 5.1 ms, raster 20.1 -> 29.8 ms. To tell a
  build regression from device variance, device-farm.yml gains a profile
  input (dist | release) for an A/B on the same phone model.
- The LG's logcat showed the insets query running and logging
  "below API 30" on every frame of every settling window: a JNI round trip
  per frame on the slowest phone. Now answered once and cached.

