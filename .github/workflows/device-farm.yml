From 4cd3ee05481643387a398be96a23b77184fd162b Mon Sep 17 00:00:00 2001
From: tejakota <krishnatejakota@gmail.com>
Date: Fri, 16 Oct 2026 05:01:19 +0000
Subject: [PATCH 1/4] ios-app.sh: CFBundleSupportedPlatforms and
 UIDeviceFamily, checked before zipping

AWS Device Farm rejected the first .ipa with IOS_APP_PLATFORM_VALUE_MISSING:
the hand-written Info.plist lacked CFBundleSupportedPlatforms, which Xcode
always writes. Added it (iPhoneOS for a device build, iPhoneSimulator for
--sim) and UIDeviceFamily (iPhone, iPad), the other key on Device Farm's
validation list that was missing. --ipa now checks every key on that list
and fails the build if one is absent or names a simulator.

Co-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>
Claude-Session: https://claude.ai/code/session_01KBjHNevoUfA3C1G93fnJfP
---
 vieww_base/ci/mobile/ios-app.sh | 25 +++++++++++++++++++++++++
 1 file changed, 25 insertions(+)

diff --git a/vieww_base/ci/mobile/ios-app.sh b/vieww_base/ci/mobile/ios-app.sh
index f01e6a18691f1287a467e17c53ad69aa6e0641fb..f1c2fcd57bb902c5d1cbdce3a26d3eba0f335483 100755
--- a/vieww_base/ci/mobile/ios-app.sh
+++ b/vieww_base/ci/mobile/ios-app.sh
@@ -90,6 +90,14 @@ esac
 
 bundle_id="dev.vieww.demo"
 app_name="vieww"
+# The platform the bundle is for, as `CFBundleSupportedPlatforms` names it.
+# AWS Device Farm refuses an .ipa without it (IOS_APP_PLATFORM_VALUE_MISSING,
+# 2026-10-16) and refuses one naming a simulator; Xcode writes it into every
+# bundle it builds, which is why nothing here had needed it before.
+case "$target_kind" in
+    sim) platform="iPhoneSimulator" ;;
+    *) platform="iPhoneOS" ;;
+esac
 
 echo "==> building $triple ($profile)"
 if [ "$profile" = "release" ]; then
@@ -130,6 +138,8 @@ cat > "$app/Info.plist" <<PLIST
     <key>CFBundleShortVersionString</key><string>0.1</string>
     <key>LSRequiresIPhoneOS</key><true/>
     <key>MinimumOSVersion</key><string>13.0</string>
+    <key>CFBundleSupportedPlatforms</key><array><string>$platform</string></array>
+    <key>UIDeviceFamily</key><array><integer>1</integer><integer>2</integer></array>
     <key>UILaunchScreen</key><dict/>
     <key>UIRequiredDeviceCapabilities</key><array><string>arm64</string></array>
     <key>UISupportedInterfaceOrientations</key>
@@ -207,6 +217,21 @@ if [ "$target_kind" = "ipa" ]; then
         echo "==> ad-hoc signed (a device cloud will re-sign this; Firebase Test Lab will not accept it)"
     fi
 
+    # **The keys device clouds validate before accepting an upload** — AWS
+    # Device Farm's list (troubleshooting-ios-applications.html): checked here
+    # so a missing one fails this build, not an upload twenty minutes later.
+    for key in CFBundleIdentifier CFBundleExecutable CFBundleSupportedPlatforms \
+        UIDeviceFamily UIRequiredDeviceCapabilities; do
+        if ! plutil -extract "$key" json -o - "$app/Info.plist" > /dev/null 2>&1; then
+            echo "ios-app: Info.plist has no $key, which device clouds require." >&2
+            exit 7
+        fi
+    done
+    if plutil -extract CFBundleSupportedPlatforms json -o - "$app/Info.plist" | grep -qi simulator; then
+        echo "ios-app: an .ipa must not name a simulator platform." >&2
+        exit 7
+    fi
+
     # An .ipa is a zip with the bundle under `Payload/`. That layout is the whole
     # format — there is no manifest to get wrong.
     payload="target/ios/Payload"
-- 
