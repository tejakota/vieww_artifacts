Subject: [PATCH 4/4] Device Farm: a CPU-raster/Vulkan-present diagnostic pass
 on every phone
MIME-Version: 1.0
Content-Type: text/plain; charset=UTF-8
Content-Transfer-Encoding: 8bit

The 2026-10-16 runs put the LG Stylo 5's CPU raster stage at ~30 ms on two
different units, against ~20 ms before the CPU present path and the dist
profile landed — so device variance is the less likely cause. To separate
the present path from the build, the Android example now reads
debug.vieww.present (vulkan|cpu -> VIEWW_PRESENT), and run-android.sh runs a
third pass, cpuvk: CPU raster presented through the Vulkan swapchain, on the
same phone in the same run. Its verdict is recorded but does not fail the
job; SUMMARY.md prints its frame time and stages beside the CPU path's.
With the profile input (dist | release), one run of each answers both
questions.

Co-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>
Claude-Session: https://claude.ai/code/session_01KBjHNevoUfA3C1G93fnJfP
