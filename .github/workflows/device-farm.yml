-            log::info!("window insets: device is below API {INSETS_API}, reporting none");
+            BELOW_API.store(true, std::sync::atomic::Ordering::Relaxed);
+            log::info!(
+                "window insets: device is below API {INSETS_API}, reporting none (asked once)"
+            );
             None
         }
