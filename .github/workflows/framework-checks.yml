name: Framework checks

# The framework's own gate, beside "Build Mobile Apps" (ci.yml), which builds
# the four apps. Every leg runs a script that already exists under
# vieww_base/ci/, so a red leg is reproducible locally with the same command.
#
#   leg            | runner          | proves
#   ---------------|-----------------|-----------------------------------------
#   gate           | ubuntu          | ci/check/checks.sh — fmt, clippy -D
#                  |                 | warnings, every test, docs. Red = do not
#                  |                 | merge.
#   coverage       | ubuntu          | ci/check/coverage.sh's line floor
#   cross          | ubuntu          | ci/check/cross-check.sh: the workspace
#                  |                 | type-checks for macOS, iOS, Windows and
#                  |                 | Android, minutes before those legs finish
#   gpu-lavapipe   | ubuntu          | the Vulkan suites on Mesa's software
#                  |                 | Vulkan (incl. vieww-3d's GPU parity
#                  |                 | suite), and a GPU frame presented to an
#                  |                 | Xvfb window
#   macos          | macos (arm64)   | platform-check macos + ios, and the Metal
#                  |                 | suite on the runner's GPU
#   windows        | windows         | platform-check windows, and the D3D12
#                  |                 | suite on WARP (Microsoft's software D3D12)
#   android        | ubuntu + NDK    | platform-check android
#   web            | ubuntu          | wasm-check, then canvas parity in
#                  |                 | Chromium, Firefox and WebKit
#   android-device | self-hosted     | the device suite on a real phone — only
#                  |                 | on demand, and only where such a runner
#                  |                 | is registered
#
# What a green run does NOT mean, so nobody reads it that way: the macOS
# runner's GPU is a paravirtualised Apple GPU and WARP is a CPU rasteriser, so
# those legs are correctness evidence, never performance evidence. A skipped
# self-hosted leg is "not run", never "passed".

# **Manual only** (Actions → Framework checks → Run workflow). Every leg below
# that has passed is gated behind `run_passed`, so a default run spends its
# minutes only on what has not passed yet: Firebase Test Lab on real phones,
# and the self-hosted phone when one exists. Tick "run_passed" to re-check
# everything, e.g. before a merge.
on:
  workflow_dispatch:
    inputs:
      run_passed:
        description: "Run already-passing jobs too (gate, coverage, cross, GPU, macOS, Windows, Android, web, iOS simulator, Android emulator)"
        type: boolean
        default: false
      build_apps:
        description: "Build the apps as downloadable artifacts: Android APKs (arm64 phone, x86_64 emulator), iOS .ipa and simulator .app"
        type: boolean
        default: true
      test_lab_android:
        description: "Firebase Test Lab, Android: game loop (CPU + GPU) on real phones, plus a Robo crawl (needs GCP_SA_KEY and FTL_PROJECT secrets)"
        type: boolean
        default: true
      test_lab_ios:
        description: "Firebase Test Lab, iOS: game loop on real iPhones (needs the Apple signing secrets too)"
        type: boolean
        default: false
      device:
        description: "Also run the Android device suite on a self-hosted runner labelled 'android'"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: framework-checks-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Must equal vieww_base/rust-toolchain.toml; the toolchain file is what
  # cargo actually obeys, this only pre-installs it in one step.
  RUST_VERSION: "1.98.1"

defaults:
  run:
    shell: bash
    working-directory: vieww_base

jobs:
  gate:
    # Passed (2026-10-14). Runs only when "run_passed" is ticked.
    if: inputs.run_passed
    name: checks.sh (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      # Cold builds of the workspace were most of every job's time.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: vieww_base -> target
      - name: Toolchain
        run: rustup toolchain install "$RUST_VERSION" --profile minimal --component rustfmt,clippy,llvm-tools-preview
      - name: System packages
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libx11-dev libxkbcommon-dev libwayland-dev libgtk-3-dev \
            libxdo-dev libasound2-dev libxkbcommon-x11-0 xvfb
      - name: Free disk
        run: bash ci/tools/ci-runner-prep.sh || true
      - name: The gate
        run: |
          mkdir -p ../ci-artifacts
          ci/check/checks.sh 2>&1 | tee ../ci-artifacts/gate.log
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: gate-log
          path: ci-artifacts/gate.log

  coverage:
    # Passed (2026-10-14). Runs only when "run_passed" is ticked.
    if: inputs.run_passed
    name: Coverage floor
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      # Cold builds of the workspace were most of every job's time.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: vieww_base -> target
      - name: Toolchain and cargo-llvm-cov
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --component llvm-tools-preview
          cargo install cargo-llvm-cov --locked
      - name: System packages
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libx11-dev libxkbcommon-dev libwayland-dev libgtk-3-dev libxdo-dev libasound2-dev libxkbcommon-x11-0
      - name: Free disk
        run: bash ci/tools/ci-runner-prep.sh || true
      - name: Coverage
        run: ci/check/coverage.sh

  cross:
    # Passed (2026-10-14). Runs only when "run_passed" is ticked.
    if: inputs.run_passed
    name: Type-check for macOS, iOS, Windows, Android (from Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      # Cold builds of the workspace were most of every job's time.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: vieww_base -> target
      - name: Toolchain with std sources
        run: rustup toolchain install "$RUST_VERSION" --profile minimal --component rust-src
      - name: Cross type-check
        run: ci/check/cross-check.sh

  gpu-lavapipe:
    # Passed (2026-10-14). Runs only when "run_passed" is ticked.
    if: inputs.run_passed
    name: GPU on software Vulkan (lavapipe)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      # Cold builds of the workspace were most of every job's time.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: vieww_base -> target
      - name: Toolchain
        run: rustup toolchain install "$RUST_VERSION" --profile minimal
      - name: Mesa Vulkan, Xvfb
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q mesa-vulkan-drivers vulkan-tools libvulkan-dev xvfb \
            libx11-dev libxkbcommon-dev libxkbcommon-x11-0 libwayland-dev
          echo "VK_ICD_FILENAMES=$(ls /usr/share/vulkan/icd.d/lvp_icd*.json | head -1)" >> "$GITHUB_ENV"
      - name: Adapter
        run: vulkaninfo --summary
      - name: Vulkan suites (headless)
        run: cargo test --release -p vieww-hal --features vulkan -- --ignored --test-threads=1
      - name: 3D GPU parity suite (headless)
        run: cargo test --release -p vieww-3d --features vulkan -- --ignored --test-threads=1
      - name: A GPU frame presented to a real window
        env:
          VIEWW_REQUIRE_HARDWARE: display,gpu
        run: |
          mkdir -p ../ci-artifacts
          xvfb-run -a -s "-screen 0 1366x768x24" cargo test --release -p vieww-platform-winit --test wait_loop 2>&1 | tee ../ci-artifacts/gpu-window.log
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: gpu-window-log
          path: ci-artifacts/gpu-window.log

  macos:
    # Passed (2026-10-14). Runs only when "run_passed" is ticked.
    if: inputs.run_passed
    name: macOS and iOS (Metal)
    runs-on: macos-14
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      # Cold builds of the workspace were most of every job's time.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: vieww_base -> target
      - name: Toolchain and iOS targets
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --component clippy
          rustup target add --toolchain "$RUST_VERSION" aarch64-apple-ios aarch64-apple-ios-sim
      - name: platform-check macos
        run: ci/check/platform-check.sh macos
      - name: platform-check ios
        run: ci/check/platform-check.sh ios
      - name: Metal suite on the runner's GPU
        env:
          VIEWW_REQUIRE_HARDWARE: gpu
        run: cargo test -p vieww-hal --features metal -- --ignored --test-threads=1
      - name: Clippy for the Apple backends
        run: |
          cargo clippy -p vieww-hal --features metal --all-targets -- -D warnings
          cargo clippy -p vieww-audio --all-targets -- -D warnings
          cargo clippy -p vieww-hal --features metal --target aarch64-apple-ios -- -D warnings

  windows:
    # Passed (2026-10-14). Runs only when "run_passed" is ticked.
    if: inputs.run_passed
    name: Windows (D3D12 on WARP)
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      # Cold builds of the workspace were most of every job's time.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: vieww_base -> target
      - name: Toolchain
        run: rustup toolchain install "$RUST_VERSION" --profile minimal --component clippy
      - name: platform-check windows
        run: ci/check/platform-check.sh windows
      - name: D3D12 suite (WARP when there is no hardware adapter)
        env:
          VIEWW_D3D12_ALLOW_WARP: "1"
          VIEWW_REQUIRE_HARDWARE: gpu
        run: cargo test -p vieww-hal --features d3d12 -- --ignored --test-threads=1
      - name: Clippy for the Windows backends
        run: |
          cargo clippy -p vieww-hal --features d3d12 --all-targets -- -D warnings
          cargo clippy -p vieww-audio --all-targets -- -D warnings
      # PENDING §3.3: the out-of-process preview exists *for* Windows — an
      # in-process guest's panic cannot be caught there (static libstd) — and
      # had never run on it.
      - name: Studio out-of-process preview (PENDING §3.3)
        run: cargo test -p viewwstudio --test remote -- --test-threads=1

  android:
    # Passed (2026-10-14). Runs only when "run_passed" is ticked.
    if: inputs.run_passed
    name: Android (compile)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      # Cold builds of the workspace were most of every job's time.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: vieww_base -> target
      - name: Toolchain and target
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --component clippy
          rustup target add --toolchain "$RUST_VERSION" aarch64-linux-android
      - name: platform-check android
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_LATEST_HOME }}
        run: ci/check/platform-check.sh android

  web:
    # Passed (2026-10-14). Runs only when "run_passed" is ticked.
    if: inputs.run_passed
    name: Web (wasm32; Chromium, Firefox, WebKit)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      # Cold builds of the workspace were most of every job's time.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: vieww_base -> target
      - name: Toolchain and target
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --component clippy
          rustup target add --toolchain "$RUST_VERSION" wasm32-unknown-unknown
      - name: wasm-check
        run: ci/check/wasm-check.sh
      - name: wasm-bindgen matching Cargo.lock
        run: |
          v="$(sed -n '/^name = "wasm-bindgen"$/,/^version/ s/^version = "\(.*\)"/\1/p' Cargo.lock | head -1)"
          cargo install wasm-bindgen-cli --version "$v" --locked
      - name: Build the page and the native baseline
        run: |
          bash examples/test-web/build-web.sh "$RUNNER_TEMP/web/dist"
          cargo run --release -p test-web --example baseline -- "$RUNNER_TEMP/web/baseline"
      - name: Playwright with all three engines
        run: |
          python3 -m pip install --user playwright
          python3 -m playwright install --with-deps chromium firefox webkit
      - name: Canvas parity per engine
        run: |
          status=0
          for engine in chromium firefox webkit; do
            VIEWW_WEB_BROWSER=$engine python3 examples/test-web/verify_web.py \
              "$RUNNER_TEMP/web/dist" "$RUNNER_TEMP/web/baseline" "$RUNNER_TEMP/web/out" || status=1
          done
          exit $status
        env:
          PLAYWRIGHT_BROWSERS_PATH: ""
      - name: Readbacks
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: web-readbacks
          path: ${{ runner.temp }}/web/out

  android-device:
    name: Android device suite (self-hosted)
    if: github.event_name == 'workflow_dispatch' && inputs.device
    runs-on: [self-hosted, android]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Environment
        run: . ci/mobile/android-env.sh && android_env device-suite
      - name: APK
        run: ci/mobile/apk.sh --example android
      - name: Device suite
        run: ci/mobile/device-suite.sh
      - name: Accessibility suite
        run: ci/mobile/a11y-android.sh

  # PENDING §1.4: "no frame has ever reached an iPhone, real or simulated".
  # Experimental — reported by the `report` job, not blocking the run.
  ios-simulator:
    # Passed (2026-10-14). Runs only when "run_passed" is ticked.
    if: inputs.run_passed
    name: iOS simulator (tests in the sim, a frame on its screen)
    runs-on: macos-14
    timeout-minutes: 90
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      # Cold builds of the workspace were most of every job's time.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: vieww_base -> target
      - name: Toolchain and simulator target
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup target add --toolchain "$RUST_VERSION" aarch64-apple-ios-sim aarch64-apple-ios
      - name: Boot a simulator
        run: |
          udid=$(xcrun simctl list devices available -j \
            | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for r,v in d.items() if 'iOS' in r for x in v if 'iPhone' in x['name']))")
          xcrun simctl boot "$udid" || true
          xcrun simctl bootstatus "$udid" -b
          echo "VIEWW_SIM_DEVICE=$udid" >> "$GITHUB_ENV"
      - name: Unit tests inside the simulator (simctl-runner)
        run: cargo test -p vieww-foundation -p vieww-text --target aarch64-apple-ios-sim
      # vieww draws through Vulkan and iOS has none: MoltenVK must travel in
      # the app bundle. Without it the GPU never opened and the simulator sat
      # on a black screen (startup trace ended at "opening the GPU").
      - name: MoltenVK for the simulator
        # MoltenVK-ios.tar holds only the device slice (ios-arm64) — the
        # 2026-10-14 run listed it. The simulator needs MoltenVK-all.tar: take
        # a dynamic simulator slice if it has one, otherwise link the static
        # simulator slice into a dylib with Xcode's clang.
        run: |
          curl -fsSL -o "$RUNNER_TEMP/mvk.tar" \
            https://github.com/KhronosGroup/MoltenVK/releases/download/v1.4.2/MoltenVK-all.tar
          mkdir -p "$RUNNER_TEMP/mvk" && tar -xf "$RUNNER_TEMP/mvk.tar" -C "$RUNNER_TEMP/mvk"
          echo "xcframework slices:"
          find "$RUNNER_TEMP/mvk" -maxdepth 5 -name '*.xcframework' | while read -r x; do
            echo "  ${x#"$RUNNER_TEMP"/mvk/}: $(ls "$x" | tr '\n' ' ')"
          done
          # Every MoltenVK binary in an iOS-simulator slice, sorted by what it
          # really is: a framework's binary may be static or dynamic.
          lib=""; static=""
          while read -r bin; do
            kind=$(file -b "$bin")
            echo "  ${bin#"$RUNNER_TEMP"/mvk/}: $kind"
            case "$kind" in
              *"dynamically linked shared library"*) [ -z "$lib" ] && lib="$bin" ;;
              *"ar archive"*) [ -z "$static" ] && static="$bin" ;;
            esac
          done < <(find "$RUNNER_TEMP/mvk" -ipath '*/ios-*simulator*' -type f \( -name 'libMoltenVK.dylib' -o -name 'libMoltenVK.a' -o -name 'MoltenVK' \))
          # A dynamic framework is copied whole (its binary is loaded by path).
          case "$lib" in */MoltenVK.framework/MoltenVK) lib="${lib%/MoltenVK}" ;; esac
          if [ -z "$lib" ]; then
            if [ -n "$static" ]; then
              echo "linking the static simulator slice: ${static#"$RUNNER_TEMP"/mvk/}"
              lib="$RUNNER_TEMP/libMoltenVK.dylib"
              xcrun -sdk iphonesimulator clang -dynamiclib \
                -target arm64-apple-ios13.0-simulator \
                -Wl,-force_load,"$static" \
                -framework Metal -framework Foundation -framework QuartzCore \
                -framework IOSurface -framework UIKit -framework CoreGraphics \
                -lc++ -install_name @rpath/libMoltenVK.dylib -o "$lib"
            fi
          fi
          if [ -n "$lib" ] && [ -e "$lib" ]; then
            echo "VIEWW_MOLTENVK=$lib" >> "$GITHUB_ENV"
            echo "MoltenVK for the simulator: $lib"
          else
            echo "::warning::no MoltenVK simulator slice (dynamic or static) in MoltenVK-all.tar"
          fi
      - name: The ios example on the simulator's screen
        run: ci/mobile/ios-app.sh --sim
      - name: Maestro flows on the simulator (ci/mobile/maestro/)
        run: ci/mobile/maestro.sh ios
      - name: Screenshot
        if: always()
        run: |
          sleep 5
          mkdir -p ../ci-artifacts
          xcrun simctl io booted screenshot ../ci-artifacts/ios-simulator.png || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-simulator
          path: ci-artifacts/
          if-no-files-found: ignore

  # PENDING §1.5: the Android device suite, on an emulator instead of a
  # self-hosted phone — x86_64, because that is what GitHub's Linux runners can
  # emulate at speed (KVM). Experimental, reported, not blocking.
  android-emulator:
    # Passed (2026-10-14). Runs only when "run_passed" is ticked.
    if: inputs.run_passed
    name: Android emulator (APK, device and accessibility suites)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      # Cold builds of the workspace were most of every job's time.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: vieww_base -> target
      - name: KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Toolchain, target and cargo-apk
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup target add --toolchain "$RUST_VERSION" x86_64-linux-android

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-apk
      - name: Emulator, APK, suites
        uses: reactivecircus/android-emulator-runner@v2
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_LATEST_HOME }}
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          # A phone-sized screen. The runner's default AVD is 320x640 dp, and
          # the demo's last control ("Open the menu", below the bottom bar)
          # fell off it — the first Maestro run that got that far failed on
          # exactly that. pixel_6 is 411x914 dp, close to the Redmi the device
          # suite was written on.
          profile: pixel_6
          working-directory: vieww_base
          # One line: the action runs each line of `script` in its own shell,
          # so the environment android-env.sh sets would not reach the next.
          script: bash -ec ". ci/mobile/android-env.sh && android_env device-suite && ci/mobile/apk.sh --example android --release --target x86_64-linux-android && (ci/mobile/maestro.sh android || echo '::warning::Maestro flows failed (see the maestro-android artifact)') && ci/mobile/device-suite.sh && ci/mobile/a11y-android.sh"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: maestro-android
          path: ci-artifacts/maestro-android/
          if-no-files-found: ignore

  # **Firebase Test Lab: the device suite on real phones** (ci/mobile/test-lab.sh).
  # Game loop on three physical phones from different makers — scenario 1 the
  # CPU rasterizer, scenario 2 the planned GPU path — and a Robo crawl of the
  # accessibility tree on one. Unchecked until it has run once.
  #
  # Secrets: GCP_SA_KEY (a service-account key JSON with the Firebase Test Lab
  # Admin and Storage Object Viewer roles, or Editor) and FTL_PROJECT (the
  # Firebase project id). Without them the job says so and stops.
  # **The apps, as downloadable artifacts** — and the builds the Test Lab jobs
  # below upload, so nothing is built twice. Release, because a debug build's
  # frame times mean nothing; signed with the debug keystore android-env.sh
  # creates, so the APK installs with `adb install` and on Test Lab as is.
  build-apk:
    name: Build — Android APKs
    if: inputs.build_apps || inputs.test_lab_android
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: vieww_base -> target
      - name: Toolchain, targets and cargo-apk
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup target add --toolchain "$RUST_VERSION" aarch64-linux-android x86_64-linux-android
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-apk
      - name: Release APKs (arm64 for phones, x86_64 for emulators)
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_LATEST_HOME }}
        run: |
          . ci/mobile/android-env.sh
          android_env build-apk
          mkdir -p ../dist
          for target in aarch64-linux-android x86_64-linux-android; do
            marker="$(mktemp)"
            cargo apk build -p vieww-platform-winit --example android --release --target "$target"
            apk="$(find target -path '*/apk/*' -name '*.apk' -newer "$marker" | head -1)"
            [ -n "$apk" ] || { echo "::error::no APK for $target"; exit 1; }
            case "$target" in
              aarch64*) cp "$apk" ../dist/vieww-arm64.apk ;;
              x86_64*) cp "$apk" ../dist/vieww-x86_64.apk ;;
            esac
          done
          ls -l ../dist
      - uses: actions/upload-artifact@v4
        with:
          name: vieww-apk
          path: dist/

  # The iOS builds: an .ipa for real iPhones — signed with the Apple identity
  # when the IOS_* secrets exist (what Firebase Test Lab needs), ad-hoc
  # otherwise (device clouds that re-sign) — and a simulator .app to drag onto a
  # Mac's simulator. MoltenVK is bundled in both: the device slice in the .ipa,
  # the simulator slice in the .app.
  build-ipa:
    name: Build — iOS .ipa and simulator .app
    if: inputs.build_apps || inputs.test_lab_ios
    runs-on: macos-14
    timeout-minutes: 90
    env:
      HAS_CERT: ${{ secrets.IOS_CERT_P12 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: vieww_base -> target
      - name: Toolchain and iOS targets
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup target add --toolchain "$RUST_VERSION" aarch64-apple-ios aarch64-apple-ios-sim
      - name: MoltenVK (device and simulator slices)
        run: |
          curl -fsSL -o "$RUNNER_TEMP/mvk.tar" \
            https://github.com/KhronosGroup/MoltenVK/releases/download/v1.4.2/MoltenVK-all.tar
          mkdir -p "$RUNNER_TEMP/mvk" && tar -xf "$RUNNER_TEMP/mvk.tar" -C "$RUNNER_TEMP/mvk"
          dev=$(find "$RUNNER_TEMP/mvk" -path '*dynamic/MoltenVK.xcframework/ios-arm64/MoltenVK.framework' -type d | head -1)
          sim=$(find "$RUNNER_TEMP/mvk" -path '*dynamic/MoltenVK.xcframework/ios-arm64_x86_64-simulator/MoltenVK.framework' -type d | head -1)
          [ -n "$dev" ] && [ -n "$sim" ] || { echo "::error::MoltenVK slices not found in MoltenVK-all.tar"; exit 1; }
          echo "MVK_DEVICE=$dev" >> "$GITHUB_ENV"
          echo "MVK_SIM=$sim" >> "$GITHUB_ENV"
      - name: Signing identity into a temporary keychain (when the secrets exist)
        if: env.HAS_CERT == 'true'
        env:
          IOS_CERT_P12: ${{ secrets.IOS_CERT_P12 }}
          IOS_CERT_PASSWORD: ${{ secrets.IOS_CERT_PASSWORD }}
          IOS_PROFILE: ${{ secrets.IOS_PROFILE }}
          IOS_IDENTITY: ${{ secrets.IOS_IDENTITY }}
        run: |
          keychain="$RUNNER_TEMP/vieww.keychain-db"
          security create-keychain -p ci "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p ci "$keychain"
          echo "$IOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$IOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci "$keychain"
          mapfile -t existing < <(security list-keychains -d user | tr -d '" ')
          security list-keychains -d user -s "$keychain" "${existing[@]}"
          echo "$IOS_PROFILE" | base64 --decode > "$RUNNER_TEMP/vieww.mobileprovision"
          echo "VIEWW_IOS_PROFILE=$RUNNER_TEMP/vieww.mobileprovision" >> "$GITHUB_ENV"
          echo "VIEWW_IOS_IDENTITY=$IOS_IDENTITY" >> "$GITHUB_ENV"
      - name: Simulator .app
        run: |
          VIEWW_MOLTENVK="$MVK_SIM" ci/mobile/ios-app.sh --sim --bundle-only
          mkdir -p ../dist
          (cd target/ios && zip -qry ../../../dist/vieww-simulator.app.zip vieww.app)
      - name: Device .ipa
        run: |
          VIEWW_MOLTENVK="$MVK_DEVICE" ci/mobile/ios-app.sh --ipa
          cp target/ios/vieww.ipa ../dist/vieww.ipa
          ls -l ../dist
      - uses: actions/upload-artifact@v4
        with:
          name: vieww-ios
          path: dist/

  test-lab-android:
    name: Firebase Test Lab — Android (real phones)
    if: inputs.test_lab_android
    needs: build-apk
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    continue-on-error: true
    env:
      FTL_PROJECT: ${{ secrets.FTL_PROJECT }}
      HAS_KEY: ${{ secrets.GCP_SA_KEY != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Secrets present?
        run: |
          if [ "$HAS_KEY" != "true" ] || [ -z "$FTL_PROJECT" ]; then
            echo "::error::Set the GCP_SA_KEY and FTL_PROJECT repository secrets (Settings → Secrets and variables → Actions)."
            exit 1
          fi
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - uses: google-github-actions/setup-gcloud@v2
      - uses: actions/download-artifact@v4
        with:
          name: vieww-apk
          path: dist
      - name: Game loop and Robo on Test Lab
        run: ci/mobile/test-lab.sh android --apk ../dist/vieww-arm64.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-lab-android
          path: vieww_base/test-lab-results-*/
          if-no-files-found: ignore

  # The same on real iPhones. Test Lab refuses an ad-hoc signature, so this
  # needs an Apple development certificate and provisioning profile:
  # IOS_CERT_P12 (base64 .p12), IOS_CERT_PASSWORD, IOS_PROFILE (base64
  # .mobileprovision) and IOS_IDENTITY (e.g. "Apple Development: ... (TEAMID)"),
  # plus GCP_SA_KEY and FTL_PROJECT.
  test-lab-ios:
    name: Firebase Test Lab — iOS (real iPhones)
    if: inputs.test_lab_ios
    needs: build-ipa
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    continue-on-error: true
    env:
      FTL_PROJECT: ${{ secrets.FTL_PROJECT }}
      HAS_KEY: ${{ secrets.GCP_SA_KEY != '' }}
      HAS_CERT: ${{ secrets.IOS_CERT_P12 != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Secrets present?
        run: |
          if [ "$HAS_KEY" != "true" ] || [ -z "$FTL_PROJECT" ] || [ "$HAS_CERT" != "true" ]; then
            echo "::error::Needs GCP_SA_KEY, FTL_PROJECT and the Apple signing secrets (IOS_CERT_P12, IOS_CERT_PASSWORD, IOS_PROFILE, IOS_IDENTITY) — Test Lab refuses an ad-hoc .ipa."
            exit 1
          fi
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - uses: google-github-actions/setup-gcloud@v2
      - uses: actions/download-artifact@v4
        with:
          name: vieww-ios
          path: dist
      - name: Game loop on Test Lab
        run: ci/mobile/test-lab.sh ios --ipa ../dist/vieww.ipa
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-lab-ios
          path: vieww_base/test-lab-results-*/
          if-no-files-found: ignore

  # **Results where a session without API access can read them.** Every run's
  # outcome — each job's conclusion, and the last lines of every failed job's
  # log — is committed to the branch `ci-results/<branch>`, force-pushed, so
  # `git fetch origin ci-results/<branch>` is all a reader needs. The sessions
  # that work on this repository can push and fetch but cannot reach the
  # GitHub API, so a run nobody can read would be a run that did not happen.
  report:
    name: Publish results to ci-results/<branch>
    if: always()
    needs: [gate, coverage, cross, gpu-lavapipe, macos, windows, android, web, ios-simulator, android-emulator, build-apk, build-ipa, test-lab-android, test-lab-ios]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          path: out/artifacts
      - name: Collect conclusions and failed logs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN: ${{ github.run_id }}
        run: |
          mkdir -p out/logs
          gh api "repos/$REPO/actions/runs/$RUN/jobs?per_page=100" > out/jobs.json
          {
            echo "# ${GITHUB_REF_NAME} @ ${GITHUB_SHA}"
            echo
            echo "run: ${GITHUB_SERVER_URL}/${REPO}/actions/runs/${RUN}"
            echo
            jq -r '.jobs[] | select(.name | startswith("Publish") | not) | "- \(.conclusion // .status): \(.name)"' out/jobs.json
          } > out/SUMMARY.md
          jq -r '.jobs[] | select(.conclusion == "failure") | "\(.id)\t\(.name)"' out/jobs.json |
          while IFS=$'\t' read -r id name; do
            safe=$(printf '%s' "$name" | tr -c 'A-Za-z0-9._-' '_')
            # The endpoint answers with a redirect to blob storage; follow it
            # with curl and keep the error text if there is one, rather than
            # leaving an empty file that says nothing (first runs did that).
            {
              jq -r --arg id "$id" '.jobs[] | select((.id|tostring) == $id) | .steps[] | select(.conclusion == "failure") | "failed step: \(.number) \(.name)"' out/jobs.json
              curl -sSL --fail-with-body -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/$REPO/actions/jobs/$id/logs" 2>&1 | tail -n 600
            } > "out/logs/$safe.log" || true
          done
          cat out/SUMMARY.md
      - name: Push to ci-results/<branch>
        env:
          TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          branch="ci-results/${GITHUB_REF_NAME//\//-}"
          # The app builds are artifacts to download, not results to read —
          # tens of MB that would otherwise be committed on every run.
          rm -rf out/artifacts/vieww-apk out/artifacts/vieww-ios
          cd out
          git init -q
          git checkout -q -b "$branch"
          git config user.name "vieww-ci"
          git config user.email "vieww-ci@users.noreply.github.com"
          git add -A
          git commit -q -m "CI results for ${GITHUB_SHA} (${GITHUB_REF_NAME})"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${REPO}.git" "HEAD:refs/heads/$branch"
