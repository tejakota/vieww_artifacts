name: Audio backends

# vieww-audio's device backends, each on the platform it targets:
#
#   * Linux: real JACK (dummy driver), PulseAudio (null sink) and PipeWire
#     (WirePlumber + a null sink) servers are started, and the backend tests
#     are told to *expect* them (VIEWW_EXPECT_BACKENDS) — a backend that
#     reports "unavailable" there fails the job instead of passing quietly.
#   * macOS (Core Audio) and Windows (WASAPI): the backends build and their
#     tests run; on runners without an audio device they must refuse
#     cleanly, which is what is checked.
#   * Android (AAudio) and the web (Web Audio): cargo check for the target;
#     the web shim's logic runs under Node with a simulated Web Audio.
#   * Every backend also type-checks and lints on Linux via
#     --cfg vieww_check_all.
#   * Loopback (tests/device_loopback.rs): a known signal is played and
#     captured back through a real driver, and every frame is checked
#     (level, phase continuity, noise floor):
#       - Linux: the kernel's snd-aloop card, every sample format and
#         both directions of rate matching, and snd-virmidi ports wired
#         together for MIDI — in a VM on a stock kernel, since the
#         runner's own has no sound drivers (ci/audio/vm-loopback.sh);
#         PulseAudio's default sink into its monitor.
#       - Windows: the VB-CABLE virtual cable, WASAPI shared and exclusive.
#       - macOS: the BlackHole virtual device through Core Audio, and
#         CoreMIDI virtual endpoints.
#     Virtual devices exercise the real OS audio stacks, not real sound
#     cards: those are the self-hosted `hardware.yml` machines' `audio`
#     step (ci/hardware/README.md).

# Manual only (Actions → this workflow → Run workflow): no push or
# pull_request trigger, by the repository owner's choice (2026-10-15).
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audio-backends-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUST_VERSION: "1.98.1"

defaults:
  run:
    shell: bash
    working-directory: vieww_base

jobs:
  linux-servers:
    name: Linux (PipeWire, JACK, PulseAudio)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --component clippy
          rustup default "$RUST_VERSION"
      - name: Install audio servers
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q jackd2 pulseaudio pipewire pipewire-bin wireplumber dbus-x11
      - name: Start servers
        run: |
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/xdg"
          mkdir -p "$XDG_RUNTIME_DIR" && chmod 700 "$XDG_RUNTIME_DIR"
          echo "XDG_RUNTIME_DIR=$XDG_RUNTIME_DIR" >> "$GITHUB_ENV"
          jackd -n vieww-ci -d dummy -r 48000 -p 256 > "$RUNNER_TEMP/jackd.log" 2>&1 &
          echo "JACK_DEFAULT_SERVER=vieww-ci" >> "$GITHUB_ENV"
          pulseaudio --daemonize=yes --exit-idle-time=-1 -n \
            --load="module-null-sink sink_name=null" --load="module-native-protocol-unix"
          pipewire > "$RUNNER_TEMP/pipewire.log" 2>&1 &
          sleep 1
          dbus-run-session -- bash -c "wireplumber > $RUNNER_TEMP/wireplumber.log 2>&1 & sleep 7200" &
          sleep 3
          pw-cli create-node adapter '{ factory.name=support.null-audio-sink node.name=vieww-null media.class=Audio/Sink object.linger=true audio.position=[FL FR] }'
          sleep 1
          JACK_DEFAULT_SERVER=vieww-ci jack_lsp
          pactl info | grep -E "Server Name|Default Sink"
          pw-cli ls Node | grep node.name
      - name: Backend tests against the running servers
        env:
          VIEWW_EXPECT_BACKENDS: jack,pulse,pipewire
        run: "cargo test -p vieww-audio --lib backend::"
      - name: Whole crate
        run: |
          cargo test -p vieww-audio
          cargo clippy -p vieww-audio --all-targets -- -D warnings
      - name: Every platform's backend type-checks and lints here
        env:
          RUSTFLAGS: --cfg vieww_check_all
          CARGO_TARGET_DIR: target/check-all
        run: |
          cargo clippy -p vieww-audio --lib --tests -- -D warnings
          cargo test -p vieww-audio --lib backend::
      - name: Live tests (load, hot-plug) and a PulseAudio loopback
        env:
          VIEWW_REQUIRE_LOOPBACK: "1"
          VIEWW_LOOP_BACKEND: pulse
        run: |
          cargo test --release -p vieww-audio --test live_backends -- --ignored --nocapture --test-threads=1
          pactl set-default-source null.monitor
          cargo test --release -p vieww-audio --test device_loopback default_device -- --ignored --nocapture
      - name: Server logs
        if: failure()
        run: tail -n 50 "$RUNNER_TEMP"/*.log

  linux-alsa-loopback:
    name: Linux (ALSA and MIDI through kernel loopbacks, in a VM)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"
      # The runner's Azure kernel is built without sound support: there is
      # no snd-aloop to load, in any package (run 2026-10-23: kernel/sound
      # absent from linux-modules-extra-*-azure). So the tests boot a stock
      # Ubuntu kernel, which has it, in a virtme-ng VM over the runner's own
      # filesystem — ci/audio/vm-loopback.sh, which runs the same by hand.
      - name: Let the runner user use KVM
        run: |
          if [ -e /dev/kvm ]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm
          else
            echo "::warning::no /dev/kvm on this runner: the VM runs emulated (slower; a missed deadline is reported as one)"
          fi
      - name: Which stock kernel
        id: kernel
        run: |
          sudo apt-get update -q
          v="$(apt-cache search --names-only '^linux-modules-extra-[0-9.]+-[0-9]+-generic$' |
               sed -E 's/^linux-modules-extra-([0-9.]+-[0-9]+)-generic.*/\1/' | sort -V | tail -1)"
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: Cache the stock kernel packages
        uses: actions/cache@v4
        with:
          path: ~/kpkg
          key: ubuntu-stock-kernel-${{ steps.kernel.outputs.version }}
      - name: Tools, kernel and its sound modules
        run: ci/audio/vm-loopback.sh --setup
      - name: ALSA (every format, rate matching both ways) and MIDI, in the VM
        run: ci/audio/vm-loopback.sh

  windows-loopback:
    name: Windows (WASAPI shared and exclusive through VB-CABLE)
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"
      # VB-CABLE: a virtual cable whose render side ("CABLE Input") plays
      # into its capture side ("CABLE Output"). Hosted runners have no
      # other endpoint, so it becomes both defaults. Installed by the
      # LABSN sound-ci-helpers script, as Mozilla's cubeb CI does.
      - name: Install VB-CABLE
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/LABSN/sound-ci-helpers "$env:RUNNER_TEMP\sch"
          powershell -ExecutionPolicy Bypass -File "$env:RUNNER_TEMP\sch\windows\setup_sound.ps1"
          Get-PnpDevice -Class AudioEndpoint | Format-Table -AutoSize
      - name: Allow microphone access (capture)
        shell: pwsh
        run: |
          New-Item -Path "HKLM:\SOFTWARE\Policies\Microsoft\Windows\AppPrivacy\" -Force | Out-Null
          New-ItemProperty -Path "HKLM:\SOFTWARE\Policies\Microsoft\Windows\AppPrivacy" -Name "LetAppsAccessMicrophone" -Value 1 -PropertyType DWord -Force
      - name: Endpoints list and open by id
        run: cargo test --release -p vieww-audio --lib backend::wasapi -- --nocapture
      - name: Loopback, shared mode
        env:
          VIEWW_REQUIRE_LOOPBACK: "1"
          VIEWW_LOOP_BACKEND: wasapi
          VIEWW_LOOP_ATTEMPTS: "3"
        run: cargo test --release -p vieww-audio --test device_loopback default_device -- --ignored --nocapture
      - name: Loopback, exclusive mode
        env:
          VIEWW_REQUIRE_LOOPBACK: "1"
          VIEWW_LOOP_BACKEND: wasapi-exclusive
          VIEWW_LOOP_ATTEMPTS: "3"
          VIEWW_AUDIO_DEBUG: "1"
        run: cargo test --release -p vieww-audio --test device_loopback default_device -- --ignored --nocapture
      - name: MIDI ports list (WinMM)
        run: cargo test --release -p vieww-audio --lib midi_io -- --nocapture

  macos-loopback:
    name: macOS (Core Audio through BlackHole, CoreMIDI virtual ports)
    # macos-14: the TCC grant below is the layout this image uses (as in
    # Mozilla's cubeb CI); a newer image may need its columns updated.
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"
      - name: Install BlackHole and make it both defaults
        run: |
          brew install switchaudio-osx blackhole-2ch
          sudo kill -9 "$(pgrep coreaudiod)"
          sleep 10
          SwitchAudioSource -s "BlackHole 2ch" -t input
          SwitchAudioSource -s "BlackHole 2ch" -t output
          SwitchAudioSource -a
      - name: Allow microphone access (capture)
        run: >-
          sqlite3 "$HOME/Library/Application Support/com.apple.TCC/TCC.db"
          "INSERT OR IGNORE INTO access VALUES ('kTCCServiceMicrophone','/usr/local/opt/runner/provisioner/provisioner',1,2,4,1,NULL,NULL,0,'UNUSED',NULL,0,1687786159,NULL,NULL,'UNUSED',1687786159);"
      - name: Devices list and open by UID
        run: cargo test --release -p vieww-audio --lib backend::coreaudio -- --nocapture
      - name: Loopback through BlackHole
        env:
          VIEWW_REQUIRE_LOOPBACK: "1"
          VIEWW_LOOP_BACKEND: coreaudio
          VIEWW_LOOP_ATTEMPTS: "3"
        run: cargo test --release -p vieww-audio --test device_loopback default_device -- --ignored --nocapture
      - name: CoreMIDI virtual endpoints round trip
        run: cargo test --release -p vieww-audio --test device_loopback coremidi -- --ignored --nocapture

  desktop:
    name: ${{ matrix.os }} (native backend)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --component clippy
          rustup default "$RUST_VERSION"
      - name: Tests and clippy
        run: |
          cargo test -p vieww-audio --lib backend::
          cargo clippy -p vieww-audio --all-targets -- -D warnings

  targets:
    name: Android and web
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain and targets
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --component clippy
          rustup default "$RUST_VERSION"
          rustup target add aarch64-linux-android wasm32-unknown-unknown
      - name: AAudio (Android)
        run: cargo clippy -p vieww-audio --lib --target aarch64-linux-android -- -D warnings
      - name: Web Audio (wasm32)
        run: cargo clippy -p vieww-audio --lib --target wasm32-unknown-unknown -- -D warnings
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Web Audio shim (Node, simulated browser)
        run: node crates/vieww-audio/web/test.mjs
