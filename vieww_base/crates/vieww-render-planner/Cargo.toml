[package]
name = "vieww-render-planner"
description = "Cost-aware CPU/GPU/hybrid execution planning: turns a render graph's ExecutionPlan into a per-pass placement decision for a specific device."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = []
# `probe::calibrate_cpu_fill` measures this machine's CPU raster throughput
# at startup, which needs the CPU rasterizer itself — `vieww-paint`'s
# `native` feature and its font/png dependencies. Off by default so the
# planner stays as light for its other consumers (the web legs) as it was;
# the windowed platform (`vieww-platform-winit`) turns it on, because it is
# the only caller of the calibration.
calibrate = ["vieww-paint/native"]

[dependencies]
vieww-foundation.workspace = true
vieww-scene.workspace = true
vieww-render-graph.workspace = true
# For `shadow::ShadowPlanner::plan`, which takes the same `Scene` the live
# renderers take. Not a new edge in the graph: `vieww-scene` above already
# depends on it.
vieww-paint.workspace = true

[lints]
workspace = true
