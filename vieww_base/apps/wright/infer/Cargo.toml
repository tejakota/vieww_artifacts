# wright-infer — the built-in models, run in-house on the CPU.
#
# A GGUF reader, the Qwen tokenizer, the Qwen3 decoder (text and tool
# calls) and Whisper (speech to text). Std only, like everything else:
# the models are numbers and the maths is written out here.
#
# Depends on wright-core and wright-runtime (it implements the runtime's
# `LocalBackend`). Depends on nothing else. Ever.
[package]
name = "wright-infer"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
wright-core = { workspace = true }
wright-runtime = { workspace = true }
