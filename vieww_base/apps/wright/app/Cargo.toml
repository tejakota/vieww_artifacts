# wright — the app.
#
# One binary: the CLI, the engine, the scheduler daemon, and (with the
# `ui` feature) the vieww shell. The ONE external dependency is vieww,
# and it is only pulled in by the `ui` feature, so CI and servers can
# build a headless binary with zero external crates.
[package]
name = "wright"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[[bin]]
name = "wright"
path = "src/main.rs"

[features]
default = []
ui = ["dep:vieww", "dep:vieww-platform-winit"]

[dependencies]
wright-core = { workspace = true }
wright-runtime = { workspace = true }
wright-agents = { workspace = true }
wright-tools = { workspace = true }
wright-engine = { workspace = true }
wright-infer = { workspace = true }

# ── THE dependency ─────────────────────────────────────────────────
# vieww, from the repository Wright lives in (`vieww_base/crates/`).
# Two crates of that ONE repository: the umbrella (`vieww`, with its
# native renderer) and its desktop platform layer (`vieww-platform-winit`).
# ADR-011: "one dependency" means one repository at one commit — and a
# path dependency inside the same repository IS the same commit, by
# construction. (Before Wright moved into `vieww_base/apps/wright` this
# was a git dependency pinned to a rev; a path dependency also spares
# CI a second clone of the whole repository, which on Windows tripped
# over path-length limits in the film folders.)
vieww = { path = "../../../crates/vieww", features = ["native"], optional = true }
vieww-platform-winit = { path = "../../../crates/vieww-platform-winit", optional = true }
