# wright-runtime — the engine room.
#
# The executor (a small structured-concurrency runtime in the tokio
# spirit), the permission gate, the task cache, model provider
# clients over our own HTTP/JSON, and the OS-native TLS boundary.
#
# Depends on wright-core. Depends on nothing else. Ever.
[package]
name = "wright-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
wright-core = { workspace = true }

[features]
# Lets other crates' TESTS mint permits without going through the gate.
# Never enabled for the shipped binary (only as a dev-dependency feature).
test-permits = []
