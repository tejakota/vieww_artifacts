# Wright — an agent harness where the user never writes code.
#
# One binary. Four libraries. One external dependency.
#
# ─────────────────────────────────────────────────────────────────
# THE DEPENDENCY. Exactly one: vieww.
#
# Everything else this app needs is built in-house, deliberately
# mimicking the proven designs of tools we studied (tokio's API
# shape, rig's unified provider surface, reqwest's minimal client,
# serde_json's value model, git's object store, Bazel's action
# cache). See docs/DECISIONS.md ADR-002.
#
# Wright lives inside the vieww repository (`vieww_base/apps/wright`), so
# the app depends on vieww by PATH (app/Cargo.toml): the same repository
# at the same commit, by construction (ADR-011). The headless binary
# (no `ui` feature) still has zero external crates.
# ─────────────────────────────────────────────────────────────────

[workspace]
resolver = "2"
members = ["app", "core", "runtime", "agents", "tools", "engine"]

[workspace.package]
version = "0.3.0"
edition = "2021"
license = "MIT"
authors = ["The Wright Authors"]
rust-version = "1.89"

[workspace.dependencies]
wright-core = { path = "core" }
wright-runtime = { path = "runtime" }
wright-agents = { path = "agents" }
wright-tools = { path = "tools" }
wright-engine = { path = "engine" }

# House style, enforced by review (see AGENTS.md):
#   * std-only unless the crate is `app` (which may add vieww, and nothing else)
#   * no unsafe outside runtime/src/tls.rs, tools/src/sandbox.rs and the
#     Windows console call in app/src/ui/mod.rs, and there only with a
#     SAFETY comment (AGENTS.md rule 2)
#   * every module starts with a doc comment a sleepy engineer can parse at 3AM
[profile.release]
opt-level = 3

# What the installers ship (`cargo build --profile dist`): release, plus
# link-time optimisation and stripped symbols.
#
# LTO lives here rather than in `release` because vieww_base/.cargo/config.toml
# builds Linux and macOS with `-C prefer-dynamic` (fast incremental links
# for the framework's own development), and rustc refuses LTO together with
# prefer-dynamic. The release workflow sets RUSTFLAGS explicitly, which
# replaces that config, so the shipped binary is static Rust and fully
# optimised; a plain `cargo build --release` keeps working on every machine.
[profile.dist]
inherits = "release"
lto = "thin"
codegen-units = 1
strip = true
