[package]
name = "film_lab"
description = "vieww launch film — element experiments: the berserk lab. Every experiment renders itself, audits its own shapes, and writes a contact sheet."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
# PNG output only (see test-premium-ui's note on default features).
image = { version = "0.25", default-features = false, features = ["png"] }
vieww = { workspace = true, features = ["native"] }
vieww-animation.workspace = true
vieww-mesh.workspace = true
vieww-physics.workspace = true
# Z19 lays the crates out as a squarified treemap of their own source.
vieww-dataviz.workspace = true
# The keynote cut: the mark in real 3D (Z10D) and the score, synthesised
# by the framework (studio_film::score).
vieww-3d.workspace = true
vieww-audio.workspace = true
vieww-foundation.workspace = true
vieww-paint = { workspace = true, features = ["native"] }
vieww-render.workspace = true
vieww-widget.workspace = true
vieww-effects.workspace = true
vieww-text.workspace = true
# THE SPARK (keynote_z) renders the *actual* viewwstudio — the real app
# mounts on the film's own FrameDriver, driven by a frame-indexed script.
viewwstudio.workspace = true
# ── The seven-minute cut's depth scenes: every crate that could carry a
# beat on screen got one ──
# Z10E: motion blur — the shutter, averaged in linear light.
vieww-video.workspace = true
# Z13D: the designer's After Effects export, played natively.
vieww-lottie.workspace = true
# Z13D: the asset pipeline — sprite sheet, mips, atlas.
vieww-image.workspace = true
vieww-asset.workspace = true
# Z10F: the dataflow cook — operators, dirty flags, the trail.
vieww-graph.workspace = true
# Z10G: the ECS swarm — the fixed loop, A* routing.
vieww-game.workspace = true
# Z16B: together — RGA text, presence, the merge.
vieww-collab.workspace = true
# Z13C: the arena — recognisers, the fling; the retained canvas stage.
vieww-gestures.workspace = true
vieww-canvas.workspace = true
# Z20B: the flight — shared elements, registry to overlay.
vieww-element.workspace = true
# Z19C: the frame itself — lifted, compiled, planned, timed, mounted.
vieww-scene.workspace = true
vieww-render-graph.workspace = true
vieww-render-planner.workspace = true
vieww-devtools.workspace = true
vieww-test-harness.workspace = true
# Z19D: the contrast — WCAG ratios, computed live.
vieww-accessibility.workspace = true

[lints]
workspace = true
