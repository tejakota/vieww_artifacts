# Workspace cargo configuration.
#
# **This file must ship with the source.** The September 2026 archive did not
# contain it (a `.cargo/` directory is a common thing for a packager or a
# `.gitignore` to drop), and without it `viewwstudio`'s `tests/pipeline.rs`
# aborts the whole `cargo test --workspace` run with "Rust cannot catch foreign
# exceptions" — see `ci/check/checks.sh`'s preflight, which describes exactly that
# failure. `ci/check/release-clean-check.sh` now fails a tree without it.
#
# Reconstructed from the contract the repository's own scripts document:
# `Cargo.toml` (the prefer-dynamic rationale), `ci/check/checks.sh` (the host block,
# verbatim), `ci/mobile/ndk-clang.sh` + its two shims (Android linkers),
# `ci/mobile/adb-runner.sh` and `ci/mobile/simctl-runner.sh` (runners). If the original file
# carried anything beyond these, restore it from the machine it came from.

# ── Desktop hosts: one shared dynamic `std` ─────────────────────────────────
#
# vieww Studio `dlopen`s preview cdylibs. Both sides must link `libstd-*.so`
# from the same toolchain or a guest panic is a foreign exception to the host's
# `catch_unwind`. `rpath` lets a binary find that `libstd` when something other
# than cargo starts it. Not for MSVC, which ships no dynamic std
# (`ci/check/platform-check.sh`), and not for mobile, where it is a link error.
#
# Note: exporting `RUSTFLAGS` at all replaces these blocks wholesale. The
# certification runs `examples/vieww-standard` that way on purpose, so its
# counting `#[global_allocator]` is honoured — see that example's
# `counting.rs`.
[target.'cfg(all(target_os = "linux", target_env = "gnu"))']
rustflags = ["-C", "prefer-dynamic", "-C", "rpath"]

[target.'cfg(target_os = "macos")']
rustflags = ["-C", "prefer-dynamic", "-C", "rpath"]

# ── x86-64: the v2 baseline (SSE4.2), restored ───────────────────────────────
#
# The original file carried this and the reconstruction above lost it. Plain
# `x86-64` is SSE2 only, with no `roundss`, so every `f32::floor`/`f32::ceil`
# in the rasterizer is a call into `compiler-builtins` (`floorf`/`ceilf` show
# up by name in a callgrind profile). TRACKER.md measured the flag alone at
# 27.4 ms -> 22.7 ms on `fixtures`' `23-editor-glass`.
#
# v2 and not v3: v2 (SSE4.2, POPCNT, 2009-era) is what Windows 11 and every
# macOS release that runs on Intel already require, so no supported desktop
# loses the binary. v3 (AVX2) would exclude real machines still in use.
#
# Cargo joins this with the host block above when both match; exporting
# `RUSTFLAGS` replaces both (see the note there).
[target.'cfg(target_arch = "x86_64")']
rustflags = ["-C", "target-cpu=x86-64-v2"]

# ── Android: NDK clang through the shims, tests on a device through adb ─────
[target.aarch64-linux-android]
linker = "ci/mobile/ndk-clang-aarch64.sh"
runner = "ci/mobile/adb-runner.sh"

[target.x86_64-linux-android]
linker = "ci/mobile/ndk-clang-x86_64.sh"
runner = "ci/mobile/adb-runner.sh"

# ── iOS simulator: tests inside `xcrun simctl spawn` ────────────────────────
[target.aarch64-apple-ios-sim]
runner = "ci/mobile/simctl-runner.sh"
