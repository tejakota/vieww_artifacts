[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/codecs",
    "crates/cli",
    "crates/engine",
    "crates/app",
    "crates/desktop",
    "crates/ios",
    "crates/android",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
vavlt-core = { path = "crates/core" }
vavlt-codecs = { path = "crates/codecs" }
vavlt-engine = { path = "crates/engine" }
vavlt-app = { path = "crates/app" }

# The UI framework, by path at the in-repo checkout — the migrated vieww
# (vello is gone; `vieww_paint::native::NativeRenderer` is the one renderer,
# CPU-rasterised and presented through vieww-hal's Vulkan swapchain — see
# vieww_base/docs/RENDERER-MIGRATION.md).
#
# `native` is enabled here rather than per-host because both hosts put frames
# on a screen and the screenshot harness needs the same backend — and because
# the old `cpu`/`gpu` pair collapsed into it when vello left the tree. A
# feature unified across the workspace is one build of the rasteriser, not
# three.
vieww = { path = "../../vieww_base/crates/vieww", features = ["native"] }
vieww-platform-winit = { path = "../../vieww_base/crates/vieww-platform-winit" }
# The effects crate the framework's frosted glass lives in — same checkout.
vieww-effects = { path = "../../vieww_base/crates/vieww-effects" }

anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1"
infer = "0.16"
walkdir = "2"
rayon = "1"
clap = { version = "4", features = ["derive"] }
zstd = "0.13"
oxipng = { version = "10", default-features = false, features = ["parallel", "zopfli"] }
lepton_jpeg = "0.5.8"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
log = "0.4"

[profile.release]
opt-level = 3
lto = "thin"

# The UI is judged by eye, and a debug rasteriser is roughly an order of
# magnitude slower than a release one — motion inspected in a debug build is a
# report on `rustc -O0`. So dependencies are optimised even in a debug build of
# the app, which keeps the app's own compile times short without making motion
# a lie.
[profile.dev.package."*"]
opt-level = 2


